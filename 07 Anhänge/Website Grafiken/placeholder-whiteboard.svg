<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1500" role="img" aria-labelledby="wb-title wb-desc">
  <title id="wb-title">Whiteboard-Detail Platzhalter</title>
  <desc id="wb-desc">Abstrakter Whiteboard-Platzhalter mit Diagramm-Skizze in WirkVektor-Farben.</desc>
  <rect width="1500" height="1500" fill="#F7F9FB"/>
  <rect x="40" y="40" width="1420" height="1420" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- Skizzierte Pfeile / Boxen -->
  <g stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
    <rect x="200" y="300" width="280" height="160" rx="4"/>
    <rect x="610" y="300" width="280" height="160" rx="4"/>
    <rect x="1020" y="300" width="280" height="160" rx="4"/>
    <path d="M480 380 L610 380"/>
    <path d="M890 380 L1020 380"/>

    <rect x="200" y="700" width="280" height="160" rx="4"/>
    <rect x="610" y="700" width="280" height="160" rx="4"/>
    <rect x="1020" y="700" width="280" height="160" rx="4"/>
    <path d="M480 780 L610 780"/>
    <path d="M890 780 L1020 780"/>

    <path d="M340 460 L340 700" stroke-dasharray="6 6"/>
    <path d="M750 460 L750 700" stroke-dasharray="6 6"/>
    <path d="M1160 460 L1160 700" stroke-dasharray="6 6"/>
  </g>

  <g stroke="#0D9488" stroke-width="3" fill="none">
    <circle cx="750" cy="1180" r="60"/>
    <path d="M750 1240 L750 1340" stroke-linecap="round"/>
    <path d="M730 1320 L750 1340 L770 1320" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, sans-serif" fill="#475569" text-anchor="middle">
    <text x="750" y="1430" font-size="22" letter-spacing="0.1em" font-weight="600">WHITEBOARD · METHODIK</text>
  </g>
</svg>
