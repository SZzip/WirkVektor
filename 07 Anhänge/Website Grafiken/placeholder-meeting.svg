<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1500" role="img" aria-labelledby="mtg-title mtg-desc">
  <title id="mtg-title">Führungssituation-Platzhalter</title>
  <desc id="mtg-desc">Abstraktes Sinnbild einer Führungssituation am Tisch in WirkVektor-Farben.</desc>
  <rect width="1500" height="1500" fill="#0F172A"/>
  <!-- Tisch -->
  <ellipse cx="750" cy="900" rx="600" ry="80" fill="#22D3EE" opacity="0.15"/>
  <ellipse cx="750" cy="900" rx="600" ry="80" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <!-- Stühle (vereinfachte Kreise) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7">
    <circle cx="380" cy="780" r="55"/>
    <circle cx="620" cy="740" r="55"/>
    <circle cx="880" cy="740" r="55"/>
    <circle cx="1120" cy="780" r="55"/>
  </g>
  <!-- Tablets vor jedem Platz -->
  <g fill="#FFFFFF" opacity="0.3">
    <rect x="350" y="855" width="60" height="40" rx="2"/>
    <rect x="590" y="855" width="60" height="40" rx="2"/>
    <rect x="850" y="855" width="60" height="40" rx="2"/>
    <rect x="1090" y="855" width="60" height="40" rx="2"/>
  </g>
  <!-- Licht-Linien -->
  <g stroke="#22D3EE" stroke-width="1" fill="none" opacity="0.3">
    <path d="M0 200 L1500 200"/>
    <path d="M0 1100 L1500 1100"/>
  </g>
  <g font-family="Inter, sans-serif" fill="#FFFFFF" text-anchor="middle" opacity="0.7">
    <text x="750" y="1420" font-size="22" letter-spacing="0.1em" font-weight="600">FÜHRUNGSGREMIUM</text>
  </g>
</svg>
