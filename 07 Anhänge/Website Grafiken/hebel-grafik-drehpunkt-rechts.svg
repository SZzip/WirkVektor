<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hebel-g-title hebel-g-desc">
  <title id="hebel-g-title">Der Hebel zur Wirkung</title>
  <desc id="hebel-g-desc">Strategie, Sicherheit und Umsetzung wirken gebündelt als Hebel und werden über einen Drehpunkt in große, messbare Wirkung übersetzt. Variante mit nach rechts verschobenem Drehpunkt (stärkere Hebelwirkung).</desc>
  <defs>
    <marker id="hebel-head-navy" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="hebel-head-teal" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <g stroke="#0F172A" stroke-width="1" opacity="0.05" fill="none">
    <path d="M125 0V1000 M250 0V1000 M375 0V1000 M500 0V1000 M625 0V1000 M750 0V1000 M875 0V1000"/>
    <path d="M0 125H1000 M0 250H1000 M0 375H1000 M0 500H1000 M0 625H1000 M0 750H1000 M0 875H1000"/>
  </g>

  <path d="M110 700 H890" stroke="#0F172A" stroke-width="2" opacity="0.25" stroke-linecap="round" fill="none"/>

  <path d="M680 471 L728 700 L632 700 Z" fill="#0F172A" fill-opacity="0.08" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>

  <path d="M175 610 L820 432" stroke="#0F172A" stroke-width="11" fill="none" stroke-linecap="round"/>
  <circle cx="680" cy="471" r="9" fill="#0F172A"/>

  <g fill="none">
    <rect x="110" y="250" width="250" height="48" rx="8" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="110" y="316" width="250" height="48" rx="8" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="110" y="382" width="250" height="48" rx="8" stroke="#0F172A" stroke-width="2.5"/>
  </g>
  <g font-family="Inter, sans-serif" font-size="27" font-weight="600" fill="#0F172A" text-anchor="middle">
    <text x="235" y="283">Strategie</text>
    <text x="235" y="349">Sicherheit</text>
    <text x="235" y="415">Umsetzung</text>
  </g>
  <path d="M235 432 L235 590" stroke="#0F172A" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#hebel-head-navy)"/>

  <circle cx="805" cy="437" r="9" fill="#0D9488"/>
  <path d="M805 437 L805 210" stroke="#0D9488" stroke-width="10" stroke-linecap="round" fill="none" marker-end="url(#hebel-head-teal)"/>
  <text x="805" y="160" font-family="Hanken Grotesk, Inter, sans-serif" font-size="46" font-weight="700" fill="#0D9488" text-anchor="middle" letter-spacing="-0.5">Wirkung</text>
</svg>
