<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" role="img" aria-labelledby="portrait-title portrait-desc">
  <title id="portrait-title">Portrait-Platzhalter Sebastian Schucht</title>
  <desc id="portrait-desc">Platzhalter im WirkVektor-Designsystem im Format 4:5. Wird durch professionelles Portrait ersetzt.</desc>
  <rect width="1000" height="1250" fill="#F7F9FB"/>
  <rect x="20" y="20" width="960" height="1210" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <g stroke="#0F172A" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="500" cy="500" r="180"/>
    <path d="M260 1100 Q500 850 740 1100"/>
  </g>
  <g font-family="Inter, sans-serif" fill="#475569" text-anchor="middle">
    <text x="500" y="1170" font-size="20" letter-spacing="0.1em" font-weight="600">PORTRAIT · 4:5</text>
    <text x="500" y="1200" font-size="14" opacity="0.6">[Platzhalter, wird durch Foto ersetzt]</text>
  </g>
  <line x1="60" y1="60" x2="120" y2="60" stroke="#0D9488" stroke-width="2"/>
</svg>
