<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F7F9FB"/>
  <!-- Mark: stilisierter Vektor-Pfeil aus zwei Linien, formt ein V -->
  <g transform="translate(60 60)">
    <path d="M0 0 L50 100 L100 0" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M50 100 L100 0 L130 30" fill="none" stroke="#0D9488" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Pfeilspitze -->
    <path d="M130 30 L130 5 L105 5 Z" fill="#0D9488"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(240 130)">
    <text font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0F172A" letter-spacing="-1">Wirk<tspan fill="#0D9488">Vektor</tspan></text>
    <text y="28" font-family="Inter, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="2">KI-BERATUNG &middot; MITTELSTAND</text>
  </g>
</svg>
