<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F7F9FB"/>
  <!-- Aufsteigende Vektor-Linie: Startpunkt unten, Pfeil oben rechts. Wirkung + Richtung. -->
  <g transform="translate(60 60)">
    <circle cx="0" cy="100" r="8" fill="#0F172A"/>
    <line x1="0" y1="100" x2="120" y2="10" stroke="#0F172A" stroke-width="8" stroke-linecap="square"/>
    <path d="M120 10 L96 14 L116 32 Z" fill="#0D9488"/>
    <!-- Baseline -->
    <line x1="0" y1="100" x2="140" y2="100" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <g transform="translate(240 130)">
    <text font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0F172A" letter-spacing="-1">WirkVektor</text>
    <text y="26" font-family="Inter, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="2">KI MIT MESSBARER WIRKUNG</text>
  </g>
</svg>
