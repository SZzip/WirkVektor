<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F7F9FB"/>
  <!-- WV-Monogramm: W und V geometrisch ineinandergeschoben, V in Teal als Impact -->
  <g transform="translate(60 50)" stroke-linejoin="miter" stroke-linecap="square">
    <!-- W -->
    <path d="M0 0 L25 120 L60 30 L95 120 L120 0" fill="none" stroke="#0F172A" stroke-width="12"/>
    <!-- V als Overlay, leicht versetzt, in Teal -->
    <path d="M50 0 L90 120 L130 0" fill="none" stroke="#0D9488" stroke-width="12"/>
  </g>
  <g transform="translate(230 130)">
    <text font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0F172A" letter-spacing="-1">WirkVektor</text>
    <text y="26" font-family="Inter, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="2">KI &middot; KLAR &middot; WIRKSAM</text>
  </g>
</svg>
