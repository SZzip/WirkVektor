<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F7F9FB"/>
  <!-- Sicheres Rahmen-Quadrat (Compliance, Sicherheit) mit ausbrechendem Vektor (Wirkung). -->
  <g transform="translate(60 50)">
    <rect x="0" y="0" width="120" height="120" fill="none" stroke="#0F172A" stroke-width="6"/>
    <!-- Diagonaler Vektor, ragt aus dem Rahmen -->
    <line x1="20" y1="100" x2="150" y2="-10" stroke="#0D9488" stroke-width="8" stroke-linecap="square"/>
    <path d="M150 -10 L128 -4 L142 14 Z" fill="#0D9488"/>
    <circle cx="20" cy="100" r="7" fill="#0F172A"/>
  </g>
  <g transform="translate(260 130)">
    <text font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0F172A" letter-spacing="-1">WirkVektor</text>
    <text y="26" font-family="Inter, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="2">SICHER. GERICHTET. WIRKSAM.</text>
  </g>
</svg>
