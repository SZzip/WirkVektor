<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F7F9FB"/>
  <!-- Kompassrose: vier Vektoren aus einem Zentrum, Nord-Vektor in Teal als Richtung -->
  <g transform="translate(110 110)">
    <circle r="58" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Süd, Ost, West in Navy, dünn -->
    <line x1="0" y1="0" x2="0" y2="50" stroke="#475569" stroke-width="3"/>
    <line x1="0" y1="0" x2="50" y2="0" stroke="#475569" stroke-width="3"/>
    <line x1="0" y1="0" x2="-50" y2="0" stroke="#475569" stroke-width="3"/>
    <!-- Norden: Impact-Vektor in Teal mit Pfeilspitze -->
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#0D9488" stroke-width="6"/>
    <path d="M0 -70 L-10 -52 L10 -52 Z" fill="#0D9488"/>
    <circle r="6" fill="#0F172A"/>
  </g>
  <g transform="translate(220 110)">
    <text font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#0F172A" letter-spacing="-1">WirkVektor</text>
    <text y="26" font-family="Inter, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0D9488" letter-spacing="2">RICHTUNG. WIRKUNG. KI.</text>
  </g>
</svg>
