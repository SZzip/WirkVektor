<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F7F9FB"/>
  <!-- Reines Wordmark, das V trägt einen klassischen mathematischen Vektor-Pfeil -->
  <g transform="translate(60 130)">
    <!-- Pfeil über dem V -->
    <g transform="translate(184 -56)">
      <line x1="0" y1="6" x2="58" y2="6" stroke="#0D9488" stroke-width="4" stroke-linecap="square"/>
      <path d="M58 6 L46 0 L46 12 Z" fill="#0D9488"/>
    </g>
    <text font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#0F172A" letter-spacing="-2">WirkVektor</text>
    <text y="30" font-family="Inter, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#475569" letter-spacing="3">IHR VEKTOR ZUR WIRKUNGSVOLLEN KI</text>
  </g>
</svg>
