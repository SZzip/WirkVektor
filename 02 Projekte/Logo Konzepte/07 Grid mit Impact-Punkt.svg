<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F7F9FB"/>
  <!-- Strukturiertes 4x4-Grid (Mittelstand = Struktur). Ein Knoten ist Teal-Impact-Punkt, ein Vektor verbindet ihn. -->
  <g transform="translate(70 50)">
    <!-- Grid-Punkte -->
    <g fill="#475569">
      <circle cx="0" cy="0" r="4"/><circle cx="36" cy="0" r="4"/><circle cx="72" cy="0" r="4"/><circle cx="108" cy="0" r="4"/>
      <circle cx="0" cy="36" r="4"/><circle cx="36" cy="36" r="4"/><circle cx="72" cy="36" r="4"/><circle cx="108" cy="36" r="4"/>
      <circle cx="0" cy="72" r="4"/><circle cx="36" cy="72" r="4"/><circle cx="72" cy="72" r="4"/><circle cx="108" cy="72" r="4"/>
      <circle cx="0" cy="108" r="4"/><circle cx="36" cy="108" r="4"/><circle cx="72" cy="108" r="4"/><circle cx="108" cy="108" r="4"/>
    </g>
    <!-- Vektor durch das Grid -->
    <line x1="0" y1="108" x2="108" y2="0" stroke="#0F172A" stroke-width="5" stroke-linecap="square"/>
    <path d="M108 0 L88 6 L102 20 Z" fill="#0D9488"/>
    <!-- Highlight-Knoten -->
    <circle cx="108" cy="0" r="9" fill="#0D9488"/>
  </g>
  <g transform="translate(240 130)">
    <text font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0F172A" letter-spacing="-1">WirkVektor</text>
    <text y="26" font-family="Inter, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="2">STRUKTUR. RICHTUNG. WIRKUNG.</text>
  </g>
</svg>
