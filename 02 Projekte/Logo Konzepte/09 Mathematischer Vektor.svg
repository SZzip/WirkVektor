<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F7F9FB"/>
  <!-- Markenzeichen als mathematisches Vektor-Symbol: kleines "wv" mit Pfeil darueber -->
  <g transform="translate(60 60)">
    <!-- Pfeil über wv -->
    <line x1="6" y1="14" x2="110" y2="14" stroke="#0D9488" stroke-width="5" stroke-linecap="square"/>
    <path d="M110 14 L94 6 L94 22 Z" fill="#0D9488"/>
    <!-- "wv" Buchstaben -->
    <text x="0" y="100" font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="90" font-weight="700" fill="#0F172A" letter-spacing="-3">wv</text>
  </g>
  <g transform="translate(220 130)">
    <text font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0F172A" letter-spacing="-1">WirkVektor</text>
    <text y="26" font-family="Inter, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="2">PRÄZISION TRIFFT PRAXIS</text>
  </g>
</svg>
