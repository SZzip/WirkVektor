<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F7F9FB"/>
  <!-- Fächer aus drei Vektoren aus einem Ursprung: Beratung, Implementierung, Schulung. Mittlerer in Teal. -->
  <g transform="translate(100 165)">
    <circle r="7" fill="#0F172A"/>
    <!-- Vektor 1: links oben -->
    <line x1="0" y1="0" x2="-50" y2="-90" stroke="#475569" stroke-width="6"/>
    <path d="M-50 -90 L-58 -68 L-38 -76 Z" fill="#475569"/>
    <!-- Vektor 2: gerade oben (Impact) -->
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#0D9488" stroke-width="8"/>
    <path d="M0 -120 L-12 -98 L12 -98 Z" fill="#0D9488"/>
    <!-- Vektor 3: rechts oben -->
    <line x1="0" y1="0" x2="50" y2="-90" stroke="#475569" stroke-width="6"/>
    <path d="M50 -90 L38 -76 L58 -68 Z" fill="#475569"/>
  </g>
  <g transform="translate(220 130)">
    <text font-family="Hanken Grotesk, Inter, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0F172A" letter-spacing="-1">WirkVektor</text>
    <text y="26" font-family="Inter, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="2">BERATUNG &middot; IMPLEMENTIERUNG &middot; SCHULUNG</text>
  </g>
</svg>
