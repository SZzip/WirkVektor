<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="85mm" height="55mm" role="img" aria-label="WirkVektor Visitenkarte Rückseite">
  <title>WirkVektor Visitenkarte – Rückseite</title>

  <!-- Hintergrund: Off-White -->
  <rect width="850" height="550" fill="#F7F9FB"/>

  <!-- Vertikale Akzentlinie links: Vector Teal -->
  <rect x="0" y="0" width="6" height="550" fill="#0D9488"/>

  <!-- Glyph oben links als ruhige Verankerung -->
  <text x="55" y="100" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700"
        font-size="44" fill="#0F172A" letter-spacing="-1.5">WirkVektor</text>

  <!-- Claim -->
  <text x="55" y="132" font-family="Inter, system-ui, sans-serif" font-weight="400"
        font-size="14" fill="#475569">Ihr Vektor zur wirkungsvollen KI.</text>

  <!-- Trennlinie -->
  <line x1="55" y1="170" x2="795" y2="170" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Kontakt-Eyebrow -->
  <text x="55" y="208" font-family="Inter, system-ui, sans-serif" font-weight="600"
        font-size="11" letter-spacing="3" fill="#0D9488">KONTAKT</text>

  <!-- Kontakt-Block links: E-Mail + Web -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="55" y="252" font-weight="600" font-size="10" letter-spacing="2" fill="#94A3B8">E-MAIL</text>
    <text x="55" y="278" font-weight="500" font-size="16" fill="#0F172A">kontakt@wirkvektor.de</text>

    <text x="55" y="328" font-weight="600" font-size="10" letter-spacing="2" fill="#94A3B8">WEB</text>
    <text x="55" y="354" font-weight="500" font-size="16" fill="#0F172A">wirkvektor.de</text>
  </g>

  <!-- Kontakt-Block rechts: Telefon + LinkedIn -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="440" y="252" font-weight="600" font-size="10" letter-spacing="2" fill="#94A3B8">TELEFON</text>
    <text x="440" y="278" font-weight="500" font-size="16" fill="#0F172A">+49 — bitte ergänzen</text>

    <text x="440" y="328" font-weight="600" font-size="10" letter-spacing="2" fill="#94A3B8">LINKEDIN</text>
    <text x="440" y="354" font-weight="500" font-size="16" fill="#0F172A">linkedin.com/in/…</text>
  </g>

  <!-- Mini-Vektor unten rechts: signature -->
  <g fill="none" stroke="#0D9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="640" y1="490" x2="780" y2="445"/>
    <polyline points="765,432 780,445 775,463"/>
  </g>

  <!-- Footer-Zeile -->
  <text x="55" y="500" font-family="Inter, system-ui, sans-serif" font-weight="400"
        font-size="11" fill="#94A3B8">WirkVektor · KI-Beratung für den deutschen Mittelstand</text>
</svg>
