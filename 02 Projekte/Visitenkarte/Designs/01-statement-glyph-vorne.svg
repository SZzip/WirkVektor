<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 850" width="55mm" height="85mm" role="img" aria-label="WirkVektor Visitenkarte 01 Vorderseite">
  <title>01 · Statement Glyph · Vorderseite</title>
  <defs>
    <pattern id="wv-pattern" x="0" y="0" width="110" height="130" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <text x="0" y="32" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700" font-size="36" fill="#FFFFFF" fill-opacity="0.045" letter-spacing="-1">WV</text>
    </pattern>
  </defs>
  <rect width="550" height="850" fill="#0F172A"/>
  <rect width="550" height="850" fill="url(#wv-pattern)"/>

  <!-- Zentrales Glyph in Impact Cyan -->
  <g transform="translate(275 380)">
    <circle r="62" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.35"/>
    <text x="0" y="22" text-anchor="middle" font-family="Hanken Grotesk, system-ui, sans-serif"
          font-weight="700" font-size="74" fill="#22D3EE" letter-spacing="-3">WV</text>
  </g>

  <!-- Claim unten -->
  <text x="275" y="790" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-weight="600" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.55)">
    WIRKUNG · SICHERHEIT · KLARHEIT
