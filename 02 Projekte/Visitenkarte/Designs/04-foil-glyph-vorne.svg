<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="85mm" height="55mm" role="img" aria-label="WirkVektor Visitenkarte 04 Vorderseite">
  <title>04 · Foil Glyph · Vorderseite</title>
  <defs>
    <linearGradient id="foil04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0D9488"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="foil-shine">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <rect width="850" height="550" fill="#0F172A"/>
  <!-- Edge -->
  <rect x="0" y="0" width="8" height="550" fill="#22D3EE"/>

  <!-- Centered Foil Glyph -->
  <g transform="translate(425 320)" text-anchor="middle">
    <text font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700"
          font-size="240" letter-spacing="-12" fill="url(#foil04)" filter="url(#foil-shine)">WV</text>
  </g>

  <!-- Wortmarke schlicht weiß darunter -->
  <text x="425" y="430" text-anchor="middle" font-family="Hanken Grotesk, system-ui, sans-serif"
        font-weight="600" font-size="24" fill="#FFFFFF" letter-spacing="-0.5">WirkVektor</text>

  <!-- Sub-label -->
  <text x="425" y="465" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-weight="600" font-size="10" letter-spacing="4" fill="rgba(255,255,255,0.5)">
    KI · GOVERNANCE · WIRKUNG
  </text>
</svg>
