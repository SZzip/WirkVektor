<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 850" width="55mm" height="85mm" role="img" aria-label="WirkVektor Visitenkarte 01 Rückseite">
  <title>01 · Statement Glyph · Rückseite</title>
  <rect width="550" height="850" fill="#F7F9FB"/>

  <!-- Header: Glyph + Linie + Wortmarke -->
  <g transform="translate(50 95)">
    <text x="0" y="30" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700"
          font-size="36" fill="#0F172A" letter-spacing="-1.5">WV</text>
    <line x1="68" y1="0" x2="68" y2="40" stroke="#CBD5E1" stroke-width="1"/>
    <text x="86" y="30" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="600"
          font-size="26" fill="#0F172A" letter-spacing="-0.5">WirkVektor</text>
  </g>

  <line x1="50" y1="170" x2="500" y2="170" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Name & Position -->
  <text x="50" y="240" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700"
        font-size="32" fill="#0F172A" letter-spacing="-1">Sebastian Schucht</text>
  <text x="50" y="270" font-family="Inter, system-ui, sans-serif" font-weight="400"
        font-size="15" fill="#475569">Geschäftsführer</text>

  <!-- Adresse -->
  <g transform="translate(50 350)" font-family="Inter, system-ui, sans-serif">
    <text font-weight="600" font-size="10" letter-spacing="2" fill="#0D9488">ADRESSE</text>
    <text y="26" font-weight="400" font-size="14" fill="#0F172A">Leitenstr. 18</text>
    <text y="46" font-weight="400" font-size="14" fill="#0F172A">84048 Mainburg</text>
  </g>

  <!-- Kontakt -->
  <g transform="translate(50 470)" font-family="Inter, system-ui, sans-serif">
    <text font-weight="600" font-size="10" letter-spacing="2" fill="#0D9488">KONTAKT</text>

    <g transform="translate(0 26)">
      <circle cx="6" cy="-4" r="3" fill="#0D9488"/>
      <text x="20" font-weight="500" font-size="14" fill="#0F172A">+49 176 20 139 739</text>
    </g>
    <g transform="translate(0 52)">
      <rect x="2" y="-9" width="9" height="7" fill="none" stroke="#0D9488" stroke-width="1.2"/>
      <text x="20" font-weight="500" font-size="14" fill="#0F172A">sebastian.schucht@wirkvektor.de</text>
    </g>
    <g transform="translate(0 78)">
      <circle cx="6" cy="-4" r="4" fill="none" stroke="#0D9488" stroke-width="1.2"/>
      <text x="20" font-weight="500" font-size="14" fill="#0F172A">wirkvektor.de</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="50" y1="720" x2="500" y2="720" stroke="#E2E8F0" stroke-width="1"/>
  <text x="50" y="755" font-family="Inter, system-ui, sans-serif" font-weight="400"
        font-size="10" fill="#94A3B8">WirkVektor KI Beratungsgesellschaft mbH</text>
  <text x="50" y="772" font-family="Inter, system-ui, sans-serif" font-style="italic"
        font-size="10" fill="#94A3B8">Ihr Vektor zur wirkungsvollen KI.</text>
