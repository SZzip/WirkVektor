<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="85mm" height="55mm" role="img" aria-label="WirkVektor Visitenkarte 07 Rückseite">
  <title>07 · Editorial Quiet · Rückseite</title>
  <rect width="850" height="550" fill="#0F172A"/>

  <!-- Sehr dezentes Muster -->
  <g fill="rgba(255,255,255,0.025)" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700" font-size="42">
    <text x="80" y="80">WV</text>
    <text x="280" y="80">WV</text>
    <text x="480" y="80">WV</text>
    <text x="680" y="80">WV</text>
    <text x="180" y="200">WV</text>
    <text x="380" y="200">WV</text>
    <text x="580" y="200">WV</text>
    <text x="780" y="200">WV</text>
    <text x="80" y="450">WV</text>
    <text x="280" y="450">WV</text>
    <text x="480" y="450">WV</text>
    <text x="680" y="450">WV</text>
    <text x="180" y="520">WV</text>
    <text x="380" y="520">WV</text>
    <text x="580" y="520">WV</text>
    <text x="780" y="520">WV</text>
  </g>

  <!-- Linien horizontal -->
  <line x1="60" y1="275" x2="380" y2="275" stroke="#22D3EE" stroke-width="0.8" opacity="0.6"/>
  <line x1="470" y1="275" x2="790" y2="275" stroke="#22D3EE" stroke-width="0.8" opacity="0.6"/>

  <!-- Claim zentriert -->
  <text x="425" y="280" text-anchor="middle" font-family="Hanken Grotesk, system-ui, sans-serif"
