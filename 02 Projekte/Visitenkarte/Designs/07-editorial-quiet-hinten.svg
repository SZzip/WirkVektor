  <!-- Wortmarke unten -->
  <text x="425" y="490" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-weight="600" font-size="11" letter-spacing="4" fill="#22D3EE">WIRKVEKTOR</text>
</svg>
