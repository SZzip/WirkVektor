<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="85mm" height="55mm" role="img" aria-label="WirkVektor Visitenkarte 07 Vorderseite">
  <title>07 · Editorial Quiet · Vorderseite</title>
  <rect width="850" height="550" fill="#F7F9FB"/>

  <!-- Eyebrow oben links -->
  <text x="60" y="90" font-family="Inter, system-ui, sans-serif" font-weight="600"
        font-size="10" letter-spacing="3" fill="#0D9488">WIRKVEKTOR · MAINBURG</text>

  <!-- Name groß rechts -->
  <text x="800" y="220" text-anchor="end" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700"
