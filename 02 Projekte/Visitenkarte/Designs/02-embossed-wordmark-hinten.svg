      <text x="22" font-weight="500" font-size="14" fill="#0F172A">wirkvektor.de</text>
    </g>
    <g transform="translate(0 96)">
      <path d="M 1 -10 L 6 -2 L 11 -10 Z" fill="none" stroke="#0D9488" stroke-width="1.4"/>
      <text x="22" font-weight="500" font-size="14" fill="#0F172A">Leitenstr. 18 · 84048 Mainburg</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="50" y="500" font-family="Inter, system-ui, sans-serif" font-weight="600"
