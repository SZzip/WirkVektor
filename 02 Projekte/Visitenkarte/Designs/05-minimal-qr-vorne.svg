        <rect x="40" y="0" width="6" height="6"/><rect x="52" y="0" width="6" height="6"/>
        <rect x="64" y="0" width="6" height="6"/><rect x="76" y="0" width="6" height="6"/>
        <rect x="40" y="12" width="6" height="6"/><rect x="64" y="12" width="6" height="6"/>
