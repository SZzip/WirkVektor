      <rect x="88" y="0" width="32" height="32" fill="none" stroke="#0F172A" stroke-width="4"/>
      <rect x="98" y="10" width="12" height="12"/>
      <rect x="0" y="88" width="32" height="32" fill="none" stroke="#0F172A" stroke-width="4"/>
      <rect x="10" y="98" width="12" height="12"/>
      <!-- random pixels -->
