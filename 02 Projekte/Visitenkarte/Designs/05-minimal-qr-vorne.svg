    <text y="32" font-weight="500" font-size="15" fill="#0F172A">sebastian.schucht@wirkvektor.de</text>
    <text y="64" font-weight="500" font-size="15" fill="#0F172A">wirkvektor.de</text>
    <text y="100" font-weight="400" font-size="13" fill="#475569">Leitenstr. 18</text>
