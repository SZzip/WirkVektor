        <rect x="88" y="40" width="6" height="6"/><rect x="100" y="40" width="6" height="6"/>
        <rect x="112" y="40" width="6" height="6"/>
        <rect x="6" y="52" width="6" height="6"/><rect x="18" y="52" width="6" height="6"/>
        <rect x="46" y="52" width="6" height="6"/><rect x="70" y="52" width="6" height="6"/>
        <rect x="82" y="52" width="6" height="6"/><rect x="94" y="52" width="6" height="6"/>
        <rect x="106" y="52" width="6" height="6"/>
        <rect x="0" y="64" width="6" height="6"/><rect x="24" y="64" width="6" height="6"/>
        <rect x="40" y="64" width="6" height="6"/><rect x="58" y="64" width="6" height="6"/>
