        <rect x="118" y="64" width="6" height="6"/>
        <rect x="12" y="76" width="6" height="6"/><rect x="46" y="76" width="6" height="6"/>
        <rect x="64" y="76" width="6" height="6"/><rect x="82" y="76" width="6" height="6"/>
        <rect x="100" y="76" width="6" height="6"/>
        <rect x="40" y="88" width="6" height="6"/><rect x="52" y="88" width="6" height="6"/>
        <rect x="76" y="88" width="6" height="6"/><rect x="100" y="88" width="6" height="6"/>
        <rect x="112" y="88" width="6" height="6"/>
        <rect x="46" y="100" width="6" height="6"/><rect x="64" y="100" width="6" height="6"/>
