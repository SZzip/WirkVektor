<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="85mm" height="55mm" role="img" aria-label="WirkVektor Visitenkarte 05 Vorderseite">
  <title>05 · Minimal QR · Vorderseite</title>
  <rect width="850" height="550" fill="#F7F9FB"/>

  <!-- Glyph oben rechts in Vector Teal -->
  <g transform="translate(770 100)">
    <rect x="-26" y="-26" width="52" height="52" fill="#0D9488" rx="2"/>
    <text x="0" y="9" text-anchor="middle" font-family="Hanken Grotesk, system-ui, sans-serif"
