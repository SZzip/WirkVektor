<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 850" width="55mm" height="85mm" role="img" aria-label="WirkVektor Visitenkarte 06 Vorderseite">
  <title>06 · Vertical Authority · Vorderseite</title>
  <rect width="550" height="850" fill="#0F172A"/>

  <!-- Top Eyebrow -->
  <text x="275" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-weight="600" font-size="11" letter-spacing="5" fill="#22D3EE">EST · 2026</text>
  <line x1="225" y1="105" x2="325" y2="105" stroke="#22D3EE" stroke-width="0.8"/>

  <!-- WV-Glyph mit Box -->
  <g transform="translate(275 280)">
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#22D3EE" stroke-width="1.2"/>
    <text x="0" y="22" text-anchor="middle" font-family="Hanken Grotesk, system-ui, sans-serif"
          font-weight="700" font-size="74" fill="#FFFFFF" letter-spacing="-3">WV</text>
  </g>

  <!-- Wortmarke vertikal -->
  <text x="275" y="500" text-anchor="middle" font-family="Hanken Grotesk, system-ui, sans-serif"
        font-weight="700" font-size="46" fill="#FFFFFF" letter-spacing="-1.5">WirkVektor</text>

  <!-- Untertitel -->
  <text x="275" y="535" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-style="italic"
        font-weight="400" font-size="14" fill="rgba(255,255,255,0.68)">Ihr Vektor zur wirkungsvollen KI.</text>

  <!-- Trenner -->
  <line x1="100" y1="610" x2="450" y2="610" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Name unten -->
  <text x="275" y="670" text-anchor="middle" font-family="Hanken Grotesk, system-ui, sans-serif"
        font-weight="600" font-size="26" fill="#FFFFFF" letter-spacing="-0.5">Sebastian Schucht</text>
  <text x="275" y="697" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-weight="400" font-size="13" fill="rgba(255,255,255,0.65)">Geschäftsführer</text>

  <!-- Footer -->
  <text x="275" y="790" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-weight="600" font-size="10" letter-spacing="3" fill="rgba(255,255,255,0.4)">
    KI · GOVERNANCE · WIRKUNG
  </text>
</svg>
