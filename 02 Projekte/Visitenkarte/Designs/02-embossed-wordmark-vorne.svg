<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="85mm" height="55mm" role="img" aria-label="WirkVektor Visitenkarte 02 Vorderseite">
  <title>02 · Embossed Wordmark · Vorderseite</title>
  <defs>
    <filter id="emboss02" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.4"/>
      <feSpecularLighting result="hl" specularExponent="20" lighting-color="#FFFFFF">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="hl" in2="SourceAlpha" operator="in" result="hl2"/>
      <feComposite in="SourceGraphic" in2="hl2" operator="arithmetic" k1="0" k2="1" k3="0.4" k4="0"/>
    </filter>
  </defs>

  <rect width="850" height="550" fill="#0F172A"/>
  <!-- Vector-Teal Edge -->
  <rect x="0" y="540" width="850" height="10" fill="#0D9488"/>

  <!-- Geprägte Wortmarke "letterpress" -->
  <g transform="translate(425 285)" text-anchor="middle">
    <text font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700"
          font-size="96" letter-spacing="-3" fill="#0F172A" stroke="rgba(255,255,255,0.18)" stroke-width="0.6" filter="url(#emboss02)">WirkVektor</text>
    <!-- Highlight Layer -->
    <text y="-1" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700"
          font-size="96" letter-spacing="-3" fill="rgba(255,255,255,0.06)">WirkVektor</text>
    <!-- Shadow Layer -->
    <text y="1.5" font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700"
          font-size="96" letter-spacing="-3" fill="rgba(0,0,0,0.5)">WirkVektor</text>
    <!-- Surface Layer -->
    <text font-family="Hanken Grotesk, system-ui, sans-serif" font-weight="700"
          font-size="96" letter-spacing="-3" fill="#0F172A">WirkVektor</text>
  </g>

  <!-- Sub-Label -->
  <text x="425" y="350" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-weight="600" font-size="11" letter-spacing="4" fill="#0D9488">
    KI · BERATUNG · MITTELSTAND
  </text>

  <!-- Top eyebrow -->
  <text x="50" y="60" font-family="Inter, system-ui, sans-serif" font-weight="600"
        font-size="10" letter-spacing="3" fill="rgba(255,255,255,0.4)">EST · 2026</text>
  <text x="800" y="60" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-weight="600"
        font-size="10" letter-spacing="3" fill="rgba(255,255,255,0.4)">MAINBURG · DE</text>
</svg>
