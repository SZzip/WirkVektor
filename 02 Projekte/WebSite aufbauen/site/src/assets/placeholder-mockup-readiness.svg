<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1500" role="img" aria-labelledby="ready-title ready-desc">
  <title id="ready-title">Mockup KI-Readiness-Bericht</title>
  <desc id="ready-desc">Mockup eines KI-Readiness-Berichts in Navy und Teal.</desc>
  <rect width="1500" height="1500" fill="#F7F9FB"/>

  <!-- Paper -->
  <rect x="280" y="180" width="940" height="1180" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- Header -->
  <rect x="280" y="180" width="940" height="120" fill="#0F172A"/>
  <text x="320" y="250" font-family="Hanken Grotesk, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">KI-Readiness-Bericht</text>
  <text x="320" y="280" font-family="Inter, sans-serif" font-size="14" fill="#22D3EE" letter-spacing="0.1em">WIRKVEKTOR · VERTRAULICH</text>

  <!-- Score circle -->
  <g transform="translate(750 480)">
    <circle r="120" fill="none" stroke="#E2E8F0" stroke-width="10"/>
    <circle r="120" fill="none" stroke="#0D9488" stroke-width="10" stroke-dasharray="540 754" transform="rotate(-90)"/>
    <text y="10" font-family="Hanken Grotesk, sans-serif" font-size="48" font-weight="700" fill="#0F172A" text-anchor="middle">72</text>
    <text y="40" font-family="Inter, sans-serif" font-size="12" fill="#475569" text-anchor="middle" letter-spacing="0.1em">REIFEGRAD</text>
  </g>

  <!-- Bars -->
  <g transform="translate(320 720)">
    <text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A" letter-spacing="0.05em">DIMENSIONEN</text>
    <g transform="translate(0 30)">
      <rect width="860" height="14" fill="#E2E8F0" rx="2"/>
      <rect width="600" height="14" fill="#0D9488" rx="2"/>
      <text y="-5" font-family="Inter, sans-serif" font-size="11" fill="#475569">Strategie</text>
    </g>
    <g transform="translate(0 70)">
      <rect width="860" height="14" fill="#E2E8F0" rx="2"/>
      <rect width="430" height="14" fill="#0D9488" rx="2"/>
      <text y="-5" font-family="Inter, sans-serif" font-size="11" fill="#475569">Daten</text>
    </g>
    <g transform="translate(0 110)">
      <rect width="860" height="14" fill="#E2E8F0" rx="2"/>
      <rect width="720" height="14" fill="#0D9488" rx="2"/>
      <text y="-5" font-family="Inter, sans-serif" font-size="11" fill="#475569">Governance</text>
    </g>
    <g transform="translate(0 150)">
      <rect width="860" height="14" fill="#E2E8F0" rx="2"/>
      <rect width="540" height="14" fill="#0D9488" rx="2"/>
      <text y="-5" font-family="Inter, sans-serif" font-size="11" fill="#475569">Technik</text>
    </g>
    <g transform="translate(0 190)">
      <rect width="860" height="14" fill="#E2E8F0" rx="2"/>
      <rect width="380" height="14" fill="#0D9488" rx="2"/>
      <text y="-5" font-family="Inter, sans-serif" font-size="11" fill="#475569">Menschen</text>
    </g>
  </g>

  <!-- Text blocks -->
  <g transform="translate(320 1000)" fill="#475569" font-family="Inter, sans-serif" font-size="11">
    <rect width="860" height="6" fill="#E2E8F0" rx="2"/>
    <rect y="20" width="760" height="6" fill="#E2E8F0" rx="2"/>
    <rect y="40" width="820" height="6" fill="#E2E8F0" rx="2"/>
    <rect y="60" width="600" height="6" fill="#E2E8F0" rx="2"/>
    <rect y="100" width="860" height="6" fill="#E2E8F0" rx="2"/>
    <rect y="120" width="700" height="6" fill="#E2E8F0" rx="2"/>
    <rect y="140" width="780" height="6" fill="#E2E8F0" rx="2"/>
  </g>
</svg>
