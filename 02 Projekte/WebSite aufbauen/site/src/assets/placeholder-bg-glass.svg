<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="glass-title glass-desc">
  <title id="glass-title">Glas/Stahl-Detail Hintergrund</title>
  <desc id="glass-desc">Abstraktes Glasfassaden-Detail als dunkler Sektions-Hintergrund.</desc>
  <rect width="1920" height="1080" fill="#0F172A"/>
  <g stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.12">
    <!-- Vertikale Glaspaneele -->
    <path d="M120 0 L120 1080"/>
    <path d="M280 0 L280 1080"/>
    <path d="M440 0 L440 1080"/>
    <path d="M600 0 L600 1080"/>
    <path d="M760 0 L760 1080"/>
    <path d="M920 0 L920 1080"/>
    <path d="M1080 0 L1080 1080"/>
    <path d="M1240 0 L1240 1080"/>
    <path d="M1400 0 L1400 1080"/>
    <path d="M1560 0 L1560 1080"/>
    <path d="M1720 0 L1720 1080"/>
    <!-- Horizontale Profile -->
    <path d="M0 180 L1920 180"/>
    <path d="M0 360 L1920 360"/>
    <path d="M0 540 L1920 540"/>
    <path d="M0 720 L1920 720"/>
    <path d="M0 900 L1920 900"/>
  </g>
  <g stroke="#22D3EE" stroke-width="1.2" fill="none" opacity="0.45">
    <path d="M0 540 L1920 540"/>
    <path d="M920 0 L920 1080"/>
  </g>
  <g fill="#FFFFFF" opacity="0.06">
    <polygon points="120,180 280,180 280,360 120,360"/>
    <polygon points="600,540 760,540 760,720 600,720"/>
    <polygon points="1240,720 1400,720 1400,900 1240,900"/>
  </g>
</svg>
