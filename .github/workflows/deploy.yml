name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - '02 Projekte/WebSite aufbauen/site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

defaults:
  run:
    working-directory: '02 Projekte/WebSite aufbauen/site'

jobs:
  build-and-deploy:
    name: Build & Deploy to Hetzner
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '02 Projekte/WebSite aufbauen/site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Stage build output to space-free path
        run: cp -r "02 Projekte/WebSite aufbauen/site/dist" _deploy
        working-directory: ${{ github.workspace }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Deploy via SFTP (lftp mirror)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        working-directory: ${{ github.workspace }}
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" -p 22 "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --verbose --parallel=4 _deploy/ "$SFTP_REMOTE_PATH"
          bye
          EOF
