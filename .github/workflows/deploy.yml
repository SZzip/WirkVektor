name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - '02 Projekte/WebSite 2 Industrie-Zoom/site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Statische Site ohne Build-Tooling — der Ordner ist das Artefakt
      - name: Stage site to space-free path
        run: cp -r "02 Projekte/WebSite 2 Industrie-Zoom/site" _deploy

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Deploy via SFTP (lftp mirror)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" -p 22 "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose --parallel=4 _deploy/ "$SFTP_REMOTE_PATH"
          bye
          EOF
